<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Paraphraser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* 背景图片：替换成你自己的图片地址 */
      background: url('https://你的图片地址.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    .box {
      width: 100%;
      max-width: 800px;
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000010;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      padding: 16px;
      background: #f1f1f1;
      border-radius: 8px;
      min-height: 100px;
    }

    .tg {
      margin-top: 20px;
      text-align: center;
      color: #333;
      width: 100%;
      max-width: 800px;
    }

    .tg a {
      color: #007bff;
      font-weight: bold;
    }

    .limit {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Free AI Paraphraser | Rewrite Text</h2>
    <p class="limit">Free daily uses, no login needed</p >

    <textarea id="input" placeholder="Paste your text here..."></textarea>
    <button onclick="rewrite()">Paraphrase</button>

    <div class="result" id="result"></div>
  </div>

  <div class="tg">
    Unlimited use & API Key → click here: <a href="http://103.116.245.70:3000/register?aff=IMWv">http://103.116.245.70:3000/register?aff=IMWv</a >
  </div>

  <script>
    let count = 0;

    async function rewrite() {
      if (count >= 3) {
        document.getElementById("result").innerText = "Daily limit reached. Go to the website for unlimited.";
        return;
      }

      let text = document.getElementById("input").value;
      if (!text) return alert("Enter text");

      document.getElementById("result").innerText = "Processing...";

      // 替换成你自己的 LLM 接口
      const res = await fetch("http://103.116.245.70:3000/v1", {
        method: "POST",
        headers: { "Content-Type": "application/json",
                   "Authorization":"Bearer sk-Hj5n6Mqdv1tPhpQ8Fd1163099c714294B2Af0f1d2c958137"},
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [{ role: "user", content: "Paraphrase this text: " + text }]
        })
      });

      const data = await res.json();
      let out = data.choices?.[0]?.message?.content || "Error";
      document.getElementById("result").innerText = out;
      count++;
    }
  </script>
</body>

</html>
